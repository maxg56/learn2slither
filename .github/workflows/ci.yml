name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --group dev
      - name: Lint
        run: uv run flake8 .
      - name: Tests
        run: uv run pytest tests
        env:
          SDL_VIDEODRIVER: dummy
